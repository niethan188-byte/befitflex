ServerName localhost

<VirtualHost *:@@PORT@@>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>

    <DirectoryMatch "^/var/www/html/(config|database|docker|docs|tests|tools|vendor)(/|$)">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "(^\.|\.sql$|\.md$|\.lock$)">
        Require all denied
    </FilesMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
